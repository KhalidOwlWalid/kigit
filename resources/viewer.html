<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kigit</title>
<style>
:root {
  --bg: #0f1115; --panel: #161a20; --panel2: #1c2128; --line: #29303a;
  --text: #d9dee6; --muted: #8b95a4; --faint: #5d6672;
  --accent: #e8b84d;
  --added: #3ddc8a; --removed: #ff5b6f; --same: #6f7783; --same-pad: #8a919c;
  --board: #0a0c0f; --edge: #e2cf4a; --via: #b9bfc8;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; }
button { font: inherit; color: inherit; }
code, .mono { font-family: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }

#app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex;
  flex-direction: column; min-height: 0; }
aside section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
aside h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); }

.brand { display: flex; align-items: baseline; gap: 8px; }
.brand .logo { font-weight: 700; font-size: 16px; color: var(--accent); letter-spacing: .02em; }
.brand .board { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rev { display: grid; grid-template-columns: 44px auto 1fr; gap: 8px; align-items: baseline; margin-top: 6px; }
.rev .tag { font-size: 10px; font-weight: 700; border-radius: 4px; padding: 1px 0; text-align: center; }
.rev .tag.old { background: color-mix(in srgb, var(--removed) 22%, transparent); color: var(--removed); }
.rev .tag.new { background: color-mix(in srgb, var(--added) 22%, transparent); color: var(--added); }
.rev code { color: var(--text); }
.rev .subj { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.warn { margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 12px;
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); color: var(--text); }
.warn b { color: var(--accent); display: block; margin-bottom: 2px; }
.warn p { margin: 4px 0 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel2); cursor: pointer; user-select: none; }
.chip input { display: none; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.chip:has(input:not(:checked)) { opacity: .45; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }

.layers label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
.layers .sw { width: 12px; height: 12px; border-radius: 3px; }
.layers .canon { color: var(--faint); margin-left: auto; font-size: 11px; }
.layers input { accent-color: var(--accent); margin: 0; }

.nets { flex: 1; display: flex; flex-direction: column; min-height: 0; border-bottom: 0; }
.nets .tools { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.nets input[type=search] { flex: 1; min-width: 0; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; outline: none; }
.nets input[type=search]:focus { border-color: var(--accent); }
.nets .count { color: var(--faint); font-size: 11px; margin-bottom: 6px; }
#netlist { overflow-y: auto; flex: 1; margin: 0 -14px; padding: 0 6px; }
.net { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center;
  width: 100%; padding: 4px 8px; border: 0; background: none; border-radius: 6px; text-align: left; cursor: pointer; }
.net:hover, .net.cur { background: var(--panel2); }
.net.pin { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.net .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.net.quiet .nm { color: var(--muted); }
.net .a { color: var(--added); } .net .r { color: var(--removed); }
.net .a, .net .r, .net .len { font-size: 11px; font-variant-numeric: tabular-nums; }
.net .len { color: var(--faint); min-width: 52px; text-align: right; }

main { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#board { width: 100%; height: 100%; display: block; background: var(--board); cursor: grab; touch-action: none; }
#board.panning { cursor: grabbing; }

/* board drawing */
.trk { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.hit { fill: none; stroke: transparent; stroke-width: 9px; vector-effect: non-scaling-stroke;
  stroke-linecap: round; pointer-events: stroke; }
.trk.st0 { stroke: var(--same); } .trk.st1 { stroke: var(--added); } .trk.st2 { stroke: var(--removed); }
.pad.st0 { fill: var(--same-pad); } .pad.st1 { fill: var(--added); } .pad.st2 { fill: var(--removed); }
.via.st0 { fill: var(--via); } .via.st1 { fill: var(--added); } .via.st2 { fill: var(--removed); }
.by-layer .trk.st0 { stroke: var(--lc); } .by-layer .pad.st0 { fill: var(--lc); }
.it.st0 { opacity: .6; }
.it.st2 { opacity: .9; }
.zone { fill: var(--lc); opacity: .14; pointer-events: none; }
.hole { fill: var(--board); pointer-events: none; }
.outline path { fill: none; stroke: var(--edge); stroke-width: 1.5px; vector-effect: non-scaling-stroke; pointer-events: none; }

.layer.off { display: none; }
.hide-same .st0, .hide-added .st1, .hide-removed .st2 { display: none; }
.hide-pads .pad, .hide-pads .hole.ph { display: none; }
.hide-vias .via, .hide-vias .hole.vh { display: none; }
.hide-zones .zone { display: none; }

#board.hl .it { opacity: .1; }
#board.hl .zone { opacity: .04; }
#board.hl .it.on { opacity: 1; }
#board.hl .trk.on.st0, #board.hl .pad.on.st0 { stroke: #e6eaf0; }
#board.hl .pad.on.st0 { fill: #e6eaf0; }
#board.hl .zone.on { opacity: .38; }

/* overlays */
#tip { position: absolute; pointer-events: none; z-index: 5; max-width: 320px; padding: 8px 10px;
  background: rgba(22, 26, 32, .96); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.4); display: none; }
#tip .t { font-weight: 600; margin-bottom: 2px; }
#tip .m { color: var(--muted); font-size: 12px; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
.badge.st0 { background: #2a3039; color: var(--muted); }
.badge.st1 { background: color-mix(in srgb, var(--added) 22%, transparent); color: var(--added); }
.badge.st2 { background: color-mix(in srgb, var(--removed) 22%, transparent); color: var(--removed); }

#card { position: absolute; top: 12px; right: 12px; z-index: 4; width: 280px; padding: 12px 14px;
  background: rgba(22, 26, 32, .96); border: 1px solid var(--line); border-radius: 10px; display: none; }
#card .t { font-weight: 700; font-size: 14px; word-break: break-all; }
#card dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 10px 0; font-size: 12px; }
#card dt { color: var(--muted); } #card dd { margin: 0; font-variant-numeric: tabular-nums; }
#card .row { display: flex; gap: 8px; }
#card button { flex: 1; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; }
#card button:hover { border-color: var(--accent); }

.legend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 14px; padding: 6px 10px;
  background: rgba(22, 26, 32, .9); border: 1px solid var(--line); border-radius: 8px; font-size: 12px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; border-radius: 2px;
  margin-right: 6px; vertical-align: 3px; background: var(--c); }
.hint { position: absolute; right: 12px; bottom: 12px; color: var(--faint); font-size: 11px; }
.empty { color: var(--faint); padding: 8px; }

@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; }
  aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  #card { width: auto; left: 12px; }
  .hint { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <aside>
    <section>
      <div class="brand"><span class="logo">kigit</span><span class="board" id="boardName"></span></div>
      <div class="rev"><span class="tag old">OLD</span><code id="oldHash"></code><span class="subj" id="oldSubj"></span></div>
      <div class="rev"><span class="tag new">NEW</span><code id="newHash"></code><span class="subj" id="newSubj"></span></div>
      <div id="warnings"></div>
    </section>
    <section>
      <h3>Show</h3>
      <div class="chips">
        <label class="chip"><input type="checkbox" data-hide="hide-added" checked><span class="dot" style="background:var(--added)"></span>Added <span class="n" id="nAdded"></span></label>
        <label class="chip"><input type="checkbox" data-hide="hide-removed" checked><span class="dot" style="background:var(--removed)"></span>Removed <span class="n" id="nRemoved"></span></label>
        <label class="chip"><input type="checkbox" data-hide="hide-same" checked><span class="dot" style="background:var(--same)"></span>Unchanged</label>
        <label class="chip"><input type="checkbox" data-hide="hide-pads" checked>Pads</label>
        <label class="chip"><input type="checkbox" data-hide="hide-vias" checked>Vias</label>
        <label class="chip"><input type="checkbox" data-hide="hide-zones">Zones</label>
        <label class="chip"><input type="checkbox" id="byLayer">Layer colours</label>
      </div>
    </section>
    <section>
      <h3>Copper layers</h3>
      <div class="layers" id="layers"></div>
    </section>
    <section class="nets">
      <h3>Nets</h3>
      <div class="tools">
        <input type="search" id="search" placeholder="Filter nets  ( / )" autocomplete="off">
        <label class="chip"><input type="checkbox" id="changedOnly" checked>Changed</label>
      </div>
      <div class="count" id="netCount"></div>
      <div id="netlist"></div>
    </section>
  </aside>
  <main>
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="tip"></div>
    <div id="card"></div>
    <div class="legend">
      <span style="--c:var(--added)">Added</span>
      <span style="--c:var(--removed)">Removed</span>
      <span style="--c:var(--same)">Unchanged</span>
    </div>
    <div class="hint">Scroll to zoom · drag to pan · click to pin a net · F to fit · Esc to clear</div>
  </main>
</div>

<script>
const DATA = /*KIGIT_DATA*/null;
</script>
<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const { meta, layers, nets, items, zones, outline } = DATA;
  const svg = $("#board");
  const STATUS = ["unchanged", "added", "removed"];
  const INNER_COLORS = ["#d9a03f", "#5cb86e", "#b673e0", "#48c2c6", "#e07ab8", "#9eab4c", "#7f8fe8", "#e0865a"];

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const netName = (n) => (nets[n].name === "" ? "(no net)" : nets[n].name);
  const mm = (v) => (Math.round(v * 100) / 100).toFixed(2);
  const changeCount = (s) => s.add + s.rem + s.vAdd + s.vRem + s.pAdd + s.pRem;

  let inner = 0;
  const layerColor = layers.map((l) =>
    l.name === "F.Cu" ? "#d65a4f" : l.name === "B.Cu" ? "#4d8fe0" : INNER_COLORS[inner++ % INNER_COLORS.length]);

  // ---------- header ----------
  document.title = `kigit · ${meta.board} · ${meta.old.short} → ${meta.new.short}`;
  $("#boardName").textContent = meta.board;
  $("#oldHash").textContent = meta.old.short;
  $("#newHash").textContent = meta.new.short;
  $("#oldSubj").textContent = meta.old.subject;
  $("#newSubj").textContent = meta.new.subject;
  $("#oldSubj").title = meta.old.subject + (meta.old.date ? "\n" + meta.old.date : "");
  $("#newSubj").title = meta.new.subject + (meta.new.date ? "\n" + meta.new.date : "");
  $("#oldHash").title = meta.old.path || "";
  $("#newHash").title = meta.new.path || "";
  if (meta.warnings && meta.warnings.length) {
    $("#warnings").innerHTML = `<div class="warn"><b>⚠ Board file location changed</b>` +
      meta.warnings.map((w) => `<p>${esc(w)}</p>`).join("") + `</div>`;
  }

  // ---------- draw ----------
  const perLayer = layers.map(() => ({ zones: "", pads: ["", "", ""], tracks: ["", "", ""], hits: "" }));
  let vias = "", holes = "";

  function padSvg(it, i) {
    const cls = `it pad st${it.s}`, at = `data-i="${i}"`;
    const tf = `transform="translate(${it.x} ${it.y}) rotate(${-it.a})"`;
    if (it.shape === "circle") return `<circle class="${cls}" ${at} cx="${it.x}" cy="${it.y}" r="${it.sw / 2}"/>`;
    let r = 0;
    const m = Math.min(it.sw, it.sh);
    if (it.shape === "oval") r = m / 2;
    else if (it.shape === "roundrect") r = (it.rr || 0.25) * m;
    return `<rect class="${cls}" ${at} ${tf} x="${-it.sw / 2}" y="${-it.sh / 2}" width="${it.sw}" height="${it.sh}" rx="${r}"/>`;
  }

  items.forEach((it, i) => {
    if (it.k === "t" || it.k === "a") {
      for (const l of it.l) {
        perLayer[l].tracks[it.s] += `<path class="it trk st${it.s}" data-i="${i}" d="${it.d}" stroke-width="${it.w}"/>`;
        perLayer[l].hits += `<path class="hit st${it.s}" data-i="${i}" d="${it.d}"/>`;
      }
    } else if (it.k === "p") {
      for (const l of it.l) perLayer[l].pads[it.s] += padSvg(it, i);
      if (it.dr > 0) holes += `<circle class="hole ph st${it.s}" cx="${it.x}" cy="${it.y}" r="${it.dr / 2}"/>`;
    } else if (it.k === "v") {
      vias += `<circle class="it via st${it.s}" data-i="${i}" data-l="${it.l.join(",")}" cx="${it.x}" cy="${it.y}" r="${it.w / 2}"/>`;
      holes += `<circle class="hole vh st${it.s}" cx="${it.x}" cy="${it.y}" r="${it.dr / 2}"/>`;
    }
  });
  zones.forEach((z) => {
    for (const l of z.l) perLayer[l].zones += `<path class="zone" data-n="${z.n}" d="${z.d}"/>`;
  });

  // Unchanged first, then removed, then added on top.
  const ORDER = [0, 2, 1];
  const layerOrder = layers.map((_, i) => i).reverse(); // bottom layer drawn first
  svg.innerHTML =
    `<g id="world">` +
    layerOrder.map((l) => {
      const p = perLayer[l];
      return `<g class="layer" data-l="${l}" style="--lc:${layerColor[l]}">` +
        `<g>${p.zones}</g><g>${ORDER.map((s) => p.pads[s]).join("")}</g>` +
        `<g>${ORDER.map((s) => p.tracks[s]).join("")}</g><g>${p.hits}</g></g>`;
    }).join("") +
    `<g id="vias">${vias}</g><g>${holes}</g>` +
    `<g class="outline">${outline.map((d) => `<path d="${d}"/>`).join("")}</g></g>`;

  // Elements per net, for highlighting.
  const netEls = nets.map(() => []);
  svg.querySelectorAll(".it, .zone").forEach((el) => {
    const n = el.dataset.i !== undefined ? items[+el.dataset.i].n : +el.dataset.n;
    netEls[n].push(el);
  });

  // ---------- view box: zoom & pan ----------
  let vb = { x: 0, y: 0, w: 100, h: 100 };
  const applyVB = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  function fitBox(b, pad = 0.06) {
    const r = svg.getBoundingClientRect();
    const aspect = r.width / Math.max(r.height, 1);
    let w = Math.max(b.width, 1) * (1 + 2 * pad), h = Math.max(b.height, 1) * (1 + 2 * pad);
    if (w / h < aspect) w = h * aspect; else h = w / aspect;
    vb = { x: b.x + b.width / 2 - w / 2, y: b.y + b.height / 2 - h / 2, w, h };
    applyVB();
  }
  const outlineEl = svg.querySelector(".outline");
  const boardBox = () => (outline.length ? outlineEl : svg.querySelector("#world")).getBBox();
  const fitAll = () => fitBox(boardBox());

  function toWorld(e) {
    const p = svg.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    return p.matrixTransform(svg.getScreenCTM().inverse());
  }
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const k = Math.exp(e.deltaY * (e.deltaMode ? 0.05 : 0.0015));
    const p = toWorld(e);
    vb = { x: p.x - (p.x - vb.x) * k, y: p.y - (p.y - vb.y) * k, w: vb.w * k, h: vb.h * k };
    applyVB();
  }, { passive: false });

  let drag = null;
  svg.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.button !== 1) return;
    drag = { x: e.clientX, y: e.clientY, vb: { ...vb }, moved: false, scale: 1 / svg.getScreenCTM().a };
  });
  svg.addEventListener("pointermove", (e) => {
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 3) {
        // Capture only once it's a real drag, so a plain click still hits the item under the cursor.
        drag.moved = true;
        svg.setPointerCapture(e.pointerId);
        svg.classList.add("panning");
        hideTip();
      }
      if (drag.moved) {
        vb = { ...drag.vb, x: drag.vb.x - dx * drag.scale, y: drag.vb.y - dy * drag.scale };
        applyVB();
        return;
      }
    }
    hover(e);
  });
  svg.addEventListener("pointerup", (e) => {
    const wasDrag = drag && drag.moved;
    drag = null;
    svg.classList.remove("panning");
    if (!wasDrag && e.button === 0) {
      const n = netAt(e);
      pin(n === null || n === pinned ? null : n);
    }
  });
  svg.addEventListener("pointerleave", () => { hideTip(); setHover(null); });

  // ---------- highlight ----------
  let hovered = null, pinned = null, shown = null;
  function refreshHL() {
    const target = hovered !== null ? hovered : pinned;
    if (target === shown) return;
    if (shown !== null) netEls[shown].forEach((el) => el.classList.remove("on"));
    if (target !== null) netEls[target].forEach((el) => el.classList.add("on"));
    svg.classList.toggle("hl", target !== null);
    shown = target;
    document.querySelectorAll(".net.cur").forEach((r) => r.classList.remove("cur"));
    if (target !== null) rowFor(target)?.classList.add("cur");
  }
  const setHover = (n) => { hovered = n; refreshHL(); };
  function pin(n) {
    pinned = n;
    document.querySelectorAll(".net.pin").forEach((r) => r.classList.remove("pin"));
    if (n !== null) {
      const row = rowFor(n);
      if (row) { row.classList.add("pin"); row.scrollIntoView({ block: "nearest" }); }
    }
    renderCard();
    refreshHL();
  }

  function netAt(e) {
    const el = e.target.closest && e.target.closest("[data-i]");
    return el ? items[+el.dataset.i].n : null;
  }

  // ---------- tooltip ----------
  const tip = $("#tip");
  const hideTip = () => { tip.style.display = "none"; };
  function layerName(i) { return layers[i] ? layers[i].display : "?"; }
  function describe(it) {
    const lay = it.l.map(layerName);
    if (it.k === "t" || it.k === "a")
      return `${it.k === "a" ? "Arc" : "Track"} · ${it.w} mm wide · ${lay[0]} · ${mm(it.len)} mm long`;
    if (it.k === "v") return `Via · ⌀${it.w} / ${it.dr} mm · ${lay[0]}–${lay[lay.length - 1]}`;
    if (it.k === "p") return `Pad ${it.ref || "?"}.${it.pin} · ${it.shape} ${it.sw}×${it.sh} mm · ${lay.length > 2 ? "all layers" : lay.join(", ")}`;
    return "";
  }
  function netSummary(s) {
    const parts = [];
    if (s.add || s.rem) parts.push(`tracks ${s.add ? "+" + s.add : ""}${s.add && s.rem ? " " : ""}${s.rem ? "−" + s.rem : ""}`);
    if (s.vAdd || s.vRem) parts.push(`vias ${s.vAdd ? "+" + s.vAdd : ""}${s.vAdd && s.vRem ? " " : ""}${s.vRem ? "−" + s.vRem : ""}`);
    if (s.pAdd || s.pRem) parts.push(`pads ${s.pAdd ? "+" + s.pAdd : ""}${s.pAdd && s.pRem ? " " : ""}${s.pRem ? "−" + s.pRem : ""}`);
    const d = s.lenNew - s.lenOld;
    const len = `length ${mm(s.lenOld)} → ${mm(s.lenNew)} mm` + (Math.abs(d) >= 0.005 ? ` (${d > 0 ? "+" : ""}${mm(d)})` : "");
    return (parts.length ? parts.join(" · ") : "no changes") + "<br>" + len;
  }
  function hover(e) {
    const el = e.target.closest && e.target.closest("[data-i]");
    if (!el) { hideTip(); setHover(null); return; }
    const it = items[+el.dataset.i];
    setHover(it.n);
    const s = nets[it.n];
    tip.innerHTML =
      `<div class="t">${esc(netName(it.n))}<span class="badge st${it.s}">${STATUS[it.s].toUpperCase()}</span></div>` +
      `<div class="m">${esc(describe(it))}</div><div class="m" style="margin-top:4px">${netSummary(s)}</div>`;
    tip.style.display = "block";
    const host = svg.getBoundingClientRect();
    let x = e.clientX - host.left + 14, y = e.clientY - host.top + 14;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    if (x + tw > host.width - 8) x = e.clientX - host.left - tw - 14;
    if (y + th > host.height - 8) y = e.clientY - host.top - th - 14;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }

  // ---------- pinned net card ----------
  const card = $("#card");
  function netBox(n) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const grow = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
    netEls[n].forEach((el) => {
      if (el.classList.contains("zone")) return;
      const it = items[+el.dataset.i];
      if (it.k === "p") { const r = Math.max(it.sw, it.sh) / 2; grow(it.x - r, it.y - r); grow(it.x + r, it.y + r); return; }
      const b = el.getBBox();
      grow(b.x, b.y); grow(b.x + b.width, b.y + b.height);
    });
    return x0 === Infinity ? null : { x: x0, y: y0, width: x1 - x0, height: y1 - y0 };
  }
  function renderCard() {
    if (pinned === null) { card.style.display = "none"; return; }
    const s = nets[pinned];
    const d = s.lenNew - s.lenOld;
    const pm = (a, r) => (a || r ? `<span style="color:var(--added)">+${a}</span>  <span style="color:var(--removed)">−${r}</span>` : "—");
    card.innerHTML =
      `<div class="t">${esc(netName(pinned))}</div>` +
      `<dl><dt>Tracks</dt><dd>${pm(s.add, s.rem)} <span style="color:var(--faint)">· ${s.same} unchanged</span></dd>` +
      `<dt>Vias</dt><dd>${pm(s.vAdd, s.vRem)}</dd><dt>Pads</dt><dd>${pm(s.pAdd, s.pRem)}</dd>` +
      `<dt>Length</dt><dd>${mm(s.lenOld)} → ${mm(s.lenNew)} mm${Math.abs(d) >= 0.005 ? ` <span style="color:${d > 0 ? "var(--added)" : "var(--removed)"}">(${d > 0 ? "+" : ""}${mm(d)})</span>` : ""}</dd></dl>` +
      `<div class="row"><button id="zoomNet">Zoom to net</button><button id="clearNet">Clear</button></div>`;
    card.style.display = "block";
    $("#zoomNet").onclick = () => { const b = netBox(pinned); if (b) fitBox(b, 0.25); };
    $("#clearNet").onclick = () => pin(null);
  }

  // ---------- show toggles ----------
  document.querySelectorAll("input[data-hide]").forEach((cb) => {
    const sync = () => svg.classList.toggle(cb.dataset.hide, !cb.checked);
    cb.addEventListener("change", sync);
    sync();
  });
  $("#byLayer").addEventListener("change", (e) => svg.classList.toggle("by-layer", e.target.checked));

  let totalAdd = 0, totalRem = 0;
  nets.forEach((s) => { totalAdd += s.add + s.vAdd + s.pAdd; totalRem += s.rem + s.vRem + s.pRem; });
  $("#nAdded").textContent = totalAdd;
  $("#nRemoved").textContent = totalRem;

  // ---------- layers ----------
  const layerOn = layers.map(() => true);
  const viaEls = [...svg.querySelectorAll(".via")];
  function syncLayers() {
    svg.querySelectorAll(".layer").forEach((g) => g.classList.toggle("off", !layerOn[+g.dataset.l]));
    viaEls.forEach((v) => {
      const show = v.dataset.l.split(",").some((l) => l !== "" && layerOn[+l]);
      v.style.display = show ? "" : "none";
    });
  }
  $("#layers").innerHTML = layers.map((l, i) =>
    `<label><input type="checkbox" data-layer="${i}" checked><span class="sw" style="background:${layerColor[i]}"></span>` +
    `${esc(l.display)}${l.display !== l.name ? `<span class="canon">${esc(l.name)}</span>` : ""}</label>`).join("");
  $("#layers").addEventListener("change", (e) => {
    const i = e.target.dataset.layer;
    if (i === undefined) return;
    layerOn[+i] = e.target.checked;
    syncLayers();
  });

  // ---------- net list ----------
  const order = nets.map((_, i) => i).sort((a, b) => {
    const ca = changeCount(nets[a]), cb = changeCount(nets[b]);
    if ((ca > 0) !== (cb > 0)) return cb > 0 ? 1 : -1;
    if (ca !== cb) return cb - ca;
    return netName(a).localeCompare(netName(b), undefined, { numeric: true });
  });
  const list = $("#netlist");
  const rowFor = (n) => list.querySelector(`.net[data-n="${n}"]`);
  function renderList() {
    const q = $("#search").value.trim().toLowerCase();
    const changedOnly = $("#changedOnly").checked;
    const rows = order.filter((n) => (!changedOnly || changeCount(nets[n]) > 0) && (!q || netName(n).toLowerCase().includes(q)));
    const changedTotal = nets.filter((s) => changeCount(s) > 0).length;
    $("#netCount").textContent = `${changedTotal} of ${nets.length} nets changed · showing ${rows.length}`;
    list.innerHTML = rows.length ? rows.map((n) => {
      const s = nets[n], d = s.lenNew - s.lenOld, a = s.add + s.vAdd + s.pAdd, r = s.rem + s.vRem + s.pRem;
      const len = Math.abs(d) >= 0.005 ? `${d > 0 ? "+" : ""}${mm(d)}` : "";
      return `<button class="net${a + r ? "" : " quiet"}${n === pinned ? " pin" : ""}" data-n="${n}" title="${esc(netName(n))}">` +
        `<span class="nm">${esc(netName(n))}</span><span class="a">${a ? "+" + a : ""}</span>` +
        `<span class="r">${r ? "−" + r : ""}</span><span class="len">${len}</span></button>`;
    }).join("") : `<div class="empty">No nets match.</div>`;
  }
  list.addEventListener("mouseover", (e) => { const r = e.target.closest(".net"); if (r) setHover(+r.dataset.n); });
  list.addEventListener("mouseleave", () => setHover(null));
  list.addEventListener("click", (e) => {
    const r = e.target.closest(".net");
    if (!r) return;
    const n = +r.dataset.n;
    pin(n === pinned ? null : n);
  });
  list.addEventListener("dblclick", (e) => {
    const r = e.target.closest(".net");
    if (!r) return;
    const b = netBox(+r.dataset.n);
    if (b) fitBox(b, 0.25);
  });
  $("#search").addEventListener("input", renderList);
  $("#changedOnly").addEventListener("change", renderList);

  // ---------- keys ----------
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input[type=search]")) {
      if (e.key === "Escape") { e.target.value = ""; renderList(); e.target.blur(); }
      return;
    }
    if (e.key === "Escape") pin(null);
    else if (e.key === "f" || e.key === "F") fitAll();
    else if (e.key === "/") { e.preventDefault(); $("#search").focus(); }
  });
  window.addEventListener("resize", () => applyVB());

  renderList();
  syncLayers();
  fitAll();
})();
</script>
</body>
</html>
