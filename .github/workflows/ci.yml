# Builds kigit and runs every test on Windows and Linux, so the code stays
# portable. macOS isn't built for now. (The KiCad comparison test is skipped:
# no KiCad on CI.)
name: CI

# Site-only changes (docs/, mkdocs.yml) don't need a build.
on:
  push:
    paths-ignore: ["docs/**", "mkdocs.yml"]
  pull_request:
    paths-ignore: ["docs/**", "mkdocs.yml"]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows (MSVC)", os: windows-latest }
          - { name: "Linux (GCC)", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # libraries in submodules/

      # For the GUI tests (ctest -L gui).
      - uses: astral-sh/setup-uv@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
