# Builds the site in docs/ with MkDocs and publishes it to GitHub Pages
# (https://khalidowlwalid.github.io/kigit/). Runs when the site changes on
# main, or by hand from the Actions tab.
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push doesn't cancel one already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # no submodules needed for the site
      - uses: astral-sh/setup-uv@v5
      - uses: actions/configure-pages@v5
      # --strict: broken links and missing pages fail the build.
      - run: uvx --with-requirements docs/requirements.txt mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
